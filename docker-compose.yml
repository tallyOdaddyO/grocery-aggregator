cat << 'EOF' > docker-compose.yml
services:
  postgres:
    image: postgres:16-alpine
    container_name: retailscout-postgres
    environment:
      POSTGRES_USER: retailscout
      POSTGRES_PASSWORD: retailscout
      POSTGRES_DB: retailscout
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - retailscout-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retailscout -d retailscout"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: retailscout-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    container_name: retailscout-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://retailscout:retailscout@postgres:5432/retailscout
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: retailscout-frontend
    ports:
      - "3000:3000"
    depends_on:
      - web
    restart: unless-stopped

volumes:
  retailscout-pgdata:
EOF
